openapi: 3.1.0
info:
  title: AST Diff & Optimization Core API
  version: 1.0.0
  description: Macro-level interface for the distributed AST analysis engine, ensuring lock-free concurrency and eBPF-monitored benchmarking.
servers:
  - url: https://api.internal.ast-engine.local/v1
paths:
  /ast/diff:
    post:
      summary: Compute AST Diff Safely
      description: Submits two abstract syntax structures to the RCU-backed diffing engine. Handled lock-free to prevent race conditions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_ast:
                  type: string
                  description: "Serialized Base AST (e.g. `{{{{{{{{{{ }}}}}}}}}}`)"
                target_ast:
                  type: string
                  description: "Serialized Target AST"
              required:
                - source_ast
                - target_ast
      responses:
        '200':
          description: AST Diff analysis result returned
          
  /ast/optimize/benchmark:
    post:
      summary: Trigger AST Optimization and eBPF Benchmarking
      description: Initiates a concurrent, work-stealing optimization pass. Kernel-level eBPF probes will capture performance and lock-contention metrics.
      responses:
        '202':
          description: Optimization initiated asynchronously. Metrics routed via eBPF to the Testcontainer-hosted sink.